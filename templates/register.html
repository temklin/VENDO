{% extends "base.html" %}

{% block content %}

<div class="auth-wrap">

    <h1 class="auth-title">Регистрация</h1>

    <form id="register-form">

        <div class="card">
            <h3 class="card-title">👤 Аккаунт</h3>

            <div class="row">
                <label for="email">Email <b>*</b></label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="row">
                <label for="name">Имя <b>*</b></label>
                <input type="text" id="name" name="name" placeholder="Как вас зовут?" required>
            </div>

            <div class="row">
                <label for="password">Пароль <b>*</b></label>
                <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">📞 Контакты <span style="color:#adb5bd; font-weight:400; font-size:12px;">(необязательно)</span></h3>

            <div class="row">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67">
            </div>

<!--            <div class="row">-->
<!--                <label for="avatar_url">Ссылка на аватар</label>-->
<!--                <input type="url" id="avatar_url" name="avatar_url" placeholder="https://...">-->
<!--            </div>-->
        </div>

        <div class="actions">
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
        </div>

    </form>

    <div id="register-result" class="flash" style="display:none;"></div>

    <p class="auth-footer">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </p>

</div>


<style>
    .auth-wrap {
        max-width: 460px;
        margin: 50px auto;
    }

    .auth-title {
        font-size: 26px;
        font-weight: 700;
        color: #212529;
        margin-bottom: 22px;
        text-align: center;
    }

    .card {
        background: #fff;
        border: 1px solid #e9ecef;
        border-radius: 12px;
        padding: 22px;
        margin-bottom: 16px;
    }

    .card-title {
        font-size: 15px;
        font-weight: 600;
        color: #212529;
        margin: 0 0 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #f1f3f5;
    }

    .row {
        margin-bottom: 14px;
    }
    .row:last-child {
        margin-bottom: 0;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #495057;
        margin-bottom: 5px;
    }
    label b {
        color: #dc3545;
    }

    input {
        width: 100%;
        padding: 10px 13px;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        font-size: 14.5px;
        font-family: inherit;
        background: #fff;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
        border-color: dodgerblue;
        box-shadow: 0 0 0 3px rgba(30,144,255,0.12);
    }

    .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
    }

    .btn-primary {
        width: 100%;
        padding: 11px 26px;
        background: dodgerblue;
        color: #fff;
        border: none;
        border-radius: 22px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-primary:hover {
        background: #0e589f;
    }
    .btn-primary:disabled {
        background: #a5c9e8;
        cursor: not-allowed;
    }

    .auth-footer {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
        color: #6c757d;
    }
    .auth-footer a {
        color: dodgerblue;
        text-decoration: none;
        font-weight: 500;
    }
    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>

{% endblock %}


{% block scripts %}
<script>
    const form = document.getElementById('register-form');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = this.querySelector('button[type="submit"]');
        const resultDiv = document.getElementById('register-result');

        btn.disabled = true;
        btn.textContent = 'Создаём аккаунт...';

        const formData = new FormData(this);
        const data = {
            email: formData.get('email'),
            name: formData.get('name'),
            password: formData.get('password'),
            phone: formData.get('phone') || null,
            avatar_url: formData.get('avatar_url') || null
        };

        try {
            const regRes = await fetch('/users/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(data)
            });

            if (!regRes.ok) {
                let msg = 'Не удалось зарегистрироваться';
                try {
                    const err = await regRes.json();
                    msg = err.detail || msg;
                } catch {}
                resultDiv.className = 'flash flash-error';
                resultDiv.textContent = msg;
                resultDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Зарегистрироваться';
                return;
            }

            btn.textContent = 'Входим...';

            const loginData = new URLSearchParams({
                username: data.email,
                password: data.password
            });

            const loginRes = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                credentials: 'include',
                body: loginData
            });

            if (!loginRes.ok) {
                resultDiv.className = 'flash flash-error';
                resultDiv.textContent = 'Аккаунт создан, но войти не удалось. Войдите вручную.';
                resultDiv.style.display = 'block';
                setTimeout(() => location.href = '/login', 1800);
                return;
            }

            resultDiv.className = 'flash flash-success';
            resultDiv.textContent = 'Готово! Переходим в профиль...';
            resultDiv.style.display = 'block';
            setTimeout(() => location.href = '/profile', 700);

        } catch (error) {
            resultDiv.className = 'flash flash-error';
            resultDiv.textContent = 'Ошибка соединения: ' + error.message;
            resultDiv.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Зарегистрироваться';
        }
    });
</script>
{% endblock %}
