{% extends "base.html" %}

{% block content %}
{% if user %}

<h2 style="margin-top: 3%">Создать объявление</h2>
<form id="ad-form">
    <div class="form-group">
        <label for="category_id">Категория</label>
        <select id="category_id" name="category_id" required>
            <option value="">Выберите категорию</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="title">Заголовок</label>
        <input type="text" id="title" name="title" required>
    </div>

    <div class="form-group">
        <label for="description">Описание</label>
        <textarea id="description" name="description"></textarea>
    </div>

    <div class="form-group">
        <label for="price">Цена</label>
        <input type="number" id="price" name="price" step="0.01" required>
    </div>

    <div class="form-group">
        <label for="status">Статус</label>
        <select id="status" name="status">
            <option value="draft">Черновик</option>
            <option value="active">Активно</option>
        </select>
    </div>

    <div class="form-group">
        <label for="city">Город</label>
        <select id="city" name="city" required>
            <option value="">Выберите город</option>
            {% for city in cities %}
                <option value="{{ city.id }}">{{ city.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="address">Адрес</label>
        <input type="text" id="address" name="address">
    </div>

    <div class="form-group">
        <label for="params">Параметры (JSON)</label>
        <textarea id="params" name="params" placeholder='{"color": "red", "mileage": 10000}'></textarea>
    </div>

    <button type="submit" class="btn btn-success">Создать</button>
</form>

<div id="result" class="flash" style="display:none;"></div>
{% else %}
<h1 style="text-align: center">Добро пожаловать на VENDO - лучший сайт по продаже хлама</h1>
<div style="text-align: center; display: flex; flex-direction: column">
    <span style="font-size: 20px;">Авторизуйтесь, чтобы исследовать хлам</span>
    <a href="/login" class="btn" style="width: 10%; font-size: 30px; margin: 0 auto; margin-top: 2%">Войти</a>
</div>

{% endif %}
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('ad-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData(this);
        const data = {
            category_id: parseInt(formData.get('category_id')),
            title: formData.get('title'),
            description: formData.get('description'),
            price: parseFloat(formData.get('price')),
            status: formData.get('status'),
            city: parseInt(formData.get('city')),
            address: formData.get('address'),
            params: JSON.parse(formData.get('params') || '{}')
        };

        try {
            const response = await fetch('/advertisements/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const resultDiv = document.getElementById('result');

            if (response.ok) {
                resultDiv.className = 'flash flash-success';
                resultDiv.textContent = 'Объявление создано! ID: ' + result.id;
                resultDiv.style.display = 'block';
                this.reset();
            } else {
                resultDiv.className = 'flash flash-error';
                resultDiv.textContent = 'Ошибка: ' + JSON.stringify(result.detail || result);
                resultDiv.style.display = 'block';
            }
        } catch (error) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'flash flash-error';
            resultDiv.textContent = 'Ошибка соединения: ' + error.message;
            resultDiv.style.display = 'block';
        }
    });
</script>


{% endblock %}
