<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendo - {{ page_title or 'Доска объявлений' }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        /* Шапка */
        .header {
            margin-left: -1.3%;
            margin-top: -1.4%;
            width: 100%;
            background: white;
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            border-bottom: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 10%;
            z-index: 10000;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 5px;
            /*background: red;*/
            width: 28%;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: dodgerblue;
            letter-spacing: -0.5px;
            transition: .3s;
            font-family: "Gothic №60";
        }
        .logo:hover {
            color: #066bcc;
        }
        .page-title {
            margin-bottom: -2%;
            font-size: 20px;
            font-weight: 400;
            color: #212529;
            font-family: "Gothic №60";
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .header-right .menu {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-right .menu a {
            padding: 6px 14px;
            color: #495057;
            text-decoration: none;
            border-radius: 20px;
            font-size: 15px;
            transition: 0.2s;
        }
        .header-right .menu a:hover {
            background: #e9ecef;
            color: #212529;
        }
        .user-block {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .user-block a {
            color: dodgerblue;
            text-decoration: none;
        }
        .user-block a:hover {
            text-decoration: underline;
        }

        /* Кнопки */
        .btn {
            display: inline-block;
            padding: 7px 18px;
            background: dodgerblue;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #0e589f;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #b02a37;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #1e7e34;
        }
        .btn-outline {
            background: transparent;
            color: dodgerblue;
            /*border: 1px solid dodgerblue;*/
        }
        .btn-outline:hover {
            background: dodgerblue;
            color: white;
        }

        /* Контент */
        .content {
            padding: 25px;

        }

        /* Формы и карточки */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: dodgerblue;
            box-shadow: 0 0 0 3px rgba(30,144,255,0.2);
            outline: none;
        }
        .flash {
            padding: 12px 18px;
            margin: 10px 0;
            border-radius: 6px;
        }
        .flash-success { background: #d4edda; color: #155724; }
        .flash-error { background: #f8d7da; color: #721c24; }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-left, .header-right {
                justify-content: center;
            }
            .header-right .menu {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <a class="logo_link" style="text-decoration: none" href="/feed"><span class="logo">Vendo.</span></a>
            <span class="page-title">{{ page_title or 'Доска объявлений' }}</span>
        </div>
        <div class="search_input" style="display:flex; flex:1; min-width:200px;">
            <input  type="text" name="search" value="{{ filters.search or '' }}" placeholder="Поиск по объявлениям" style="flex:1; padding:10px 15px; border:1px solid #ced4da; border-radius:20px 0 0 20px; outline:none;">
            <button type="submit" class="btn" style="border-radius:0 20px 20px 0; padding:10px 20px;">Поиск</button>
        </div>
        <div class="header-right">
            <div class="menu">
<!--                <a href="/feed">Объявления</a>-->
                <a href="/">Создать</a>
                <a href="/favorites">Избранное</a>
                <a href="/profile">Профиль</a>

            </div>
            <div class="user-block">
                {% if user %}
<!--                    <span>Привет, <a href="/profile">{{ user.name }}</a></span>-->
<!--                    <a style="color: white" href="/logout" class="btn btn-danger">Выйти</a>-->
                {% else %}
                    <a href="/login" class="btn">Войти</a>
                    <a href="/register" class="btn btn-outline">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</div>

{% block scripts %}{% endblock %}
</body>
</html>
<style>
    input::placeholder{
        font-family: "Gothic №60";
    }

</style>
